<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1c1c1e" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="予定">
<title>予定</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header id="top">
  <button class="nav" id="prev" aria-label="前の月">‹</button>
  <h1 id="title">予定</h1>
  <button class="nav" id="next" aria-label="次の月">›</button>
  <button class="today-btn" id="goToday">今日</button>
</header>

<main id="view"></main>

<button id="fab" aria-label="予定を追加">＋</button>

<nav id="tabs">
  <button data-view="month" class="on"><span class="ti">📅</span>月</button>
  <button data-view="list"><span class="ti">☰</span>一覧</button>
  <button data-view="rules"><span class="ti">🔁</span>毎週</button>
  <button data-view="settings"><span class="ti">⚙︎</span>設定</button>
</nav>

<div id="backdrop" hidden>
  <div id="sheet" role="dialog" aria-modal="true"></div>
</div>
<div id="toast" hidden></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
